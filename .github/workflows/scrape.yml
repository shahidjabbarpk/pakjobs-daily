name: Detect new jobs

on:
  schedule:
    - cron: "17 * * * *"   # every hour (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Commit updated feed
        run: |
          git config user.name "pakjobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          NEW=$(python -c "import json;print(json.load(open('data/meta.json'))['new'])")
          git commit -m "jobs: $NEW new ($(date -u +%FT%TZ))"
          git push
